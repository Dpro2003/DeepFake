<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepfake Image Detector</title>
    <link rel="icon" href="{{ url_for('static', filename='images/search.png') }}" type="image/png">


    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Deepfake Image Detector</h1>
        </header>
        <form id="uploadForm" action="/" method="post" enctype="multipart/form-data">
            <div class="upload-section">
                <label for="fileInput" class="upload-label">Choose an Image</label>
                <input type="file" id="fileInput" name="file" accept="image/*" onchange="previewImage()" required>
            </div>
            <img id="imagePreview" src="" alt="Image Preview" style="display: none;">
            <button type="submit" class="upload-btn">Check Image</button>
            <p id="uploadMessage"></p>
        </form>
        <div class="result">
            {% if result %}
                <h2>Result: {{ result }}</h2>
                <p>Image Uploaded Successfully!</p>
            {% endif %}
        </div>
        <footer>© 2024 Deepfake Detector App</footer>
    </div>
    <script>
        // JavaScript to preview the uploaded image
        function previewImage() {
            const fileInput = document.getElementById('fileInput');
            const imagePreview = document.getElementById('imagePreview');
            const file = fileInput.files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block'; // Make the image visible
                };
                reader.readAsDataURL(file); // Read the file as a data URL
            }
        }
    </script>
</body>
</html>
